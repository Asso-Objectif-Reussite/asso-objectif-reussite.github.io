<!doctype html>
<!--
  Page de redirection des liens courts de l'association.
  index.html et 404.html sont IDENTIQUES : ne pas les modifier.
  Les liens se gèrent uniquement dans liens.js.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Objectif Réussite</title>
<script>
  /* Site servi à la racine : https://asso-objectif-reussite.github.io/nom-court
     (dépôt nommé asso-objectif-reussite.github.io, ou domaine personnalisé).
     Seulement si le site est un jour déplacé dans un dépôt ordinaire, mets son nom ici : PROJET = 'nom-du-depot'. */
  var PROJET = '';
  (function () {
    var segs = location.pathname.split('/').filter(Boolean);
    if (PROJET && segs[0] && segs[0].toLowerCase() === PROJET.toLowerCase()) segs = segs.slice(1);
    window.BASE = PROJET ? '/' + PROJET + '/' : '/';
    window.CLE = segs.join('/').replace(/(^|\/)index\.html$/i, '').toLowerCase();
    document.write('<base href="' + window.BASE + '">');
  })();
</script>
<link rel="icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#172030; --muted:#5A6474; --line:#DCE1E8;
  --navy:#1E3A66; --navy-hover:#172E52; --on-navy:#FFFFFF;
  --gold:#8F6D12; --gold-soft:#F4ECD6; --focus:#2F6FEB;
  --shadow:0 1px 2px rgba(23,32,48,.06),0 10px 30px rgba(23,32,48,.07);
  box-sizing:border-box; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#11151C; --surface:#1A2029; --surface-2:#202733; --ink:#E6EAF0; --muted:#9BA5B4; --line:#2E3643;
    --navy:#8EB0EA; --navy-hover:#A9C3F0; --on-navy:#0F1826;
    --gold:#D9B75A; --gold-soft:#3A3220; --focus:#7AA7FF;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:28px 16px 48px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header{display:flex;align-items:center;gap:14px;margin-bottom:20px}
header img{height:44px;width:auto}
h1{font-size:22px;line-height:1.2;margin:0;letter-spacing:-.015em}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
.notice{background:var(--gold-soft);border-radius:10px;padding:12px 14px;margin:0 0 16px;font-size:14.5px}
.connexion{display:flex;gap:12px;align-items:flex-start;background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:14px 16px;margin:0 0 18px}
.connexion svg{flex:none;width:22px;height:22px;margin-top:1px;color:var(--gold)}
.connexion b{display:block;font-size:16px;line-height:1.35}
.connexion .dom{color:var(--gold);white-space:nowrap}
.connexion span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.lien{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px}
.lien h2{margin:0;font-size:17px;line-height:1.3}
.lien .desc{margin:4px 0 0;color:var(--muted);font-size:14px}
.lien .actions{display:flex;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{flex:1;background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.primary:hover{background:var(--navy-hover)}
.btn.discret{border-color:transparent;background:transparent;color:var(--muted);font-weight:500;padding:0 12px}
.btn.discret:hover{background:var(--surface-2);color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none}
.vide{padding:22px 18px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.redir{text-align:center;padding-top:18vh}
.redir img{height:52px;width:auto;margin-bottom:18px}
.redir p{margin:6px 0;color:var(--muted)}
.redir a{color:var(--gold);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);max-width:min(92vw,560px);width:max-content;z-index:50;pointer-events:none;display:none}
.toast.on{display:block}
</style>
</head>
<body>
<main id="app"></main>
<script>/* liens.js toujours frais (jamais la version gardée en cache par le navigateur ou GitHub) : un ajout s'affiche tout de suite */
document.write('<script src="liens.js?v=' + Date.now() + '"><\/script>');</script>
<script>
(function () {
  var L = window.LIENS || {};
  var app = document.getElementById('app');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var court = function (cle) { return location.host + window.BASE + cle; };
  var valide = function (e) { return e && /^https?:\/\//i.test(e.url || ''); };
  var cle = window.CLE, lien = L[cle];

  // 1. Lien connu : redirection immédiate (paramètres ?… et #… transmis)
  if (cle && valide(lien)) {
    document.title = lien.titre || 'Objectif Réussite';
    var cible = lien.url;
    if (location.search) cible += (cible.indexOf('?') === -1 ? '?' : '&') + location.search.slice(1);
    if (location.hash && cible.indexOf('#') === -1) cible += location.hash;
    app.innerHTML = '<div class="redir"><img src="logo.png" alt=""><p>Ouverture de <b>' + esc(lien.titre || cle) + '</b>…</p>' +
      '<p><a href="' + esc(cible) + '">Touche ici si rien ne se passe</a></p></div>';
    location.replace(cible);
    return;
  }

  // 2. Page d'accueil : liste des outils (et message si le lien demandé n'existe pas)
  document.title = 'Les outils d\'Objectif Réussite';
  var cles = Object.keys(L).filter(function (k) { return valide(L[k]) && !L[k].cache; });
  var html = '<header><img src="logo.png" alt=""><div><h1>Les outils de l\'association</h1><p>Objectif Réussite</p></div></header>';
  if (cle) {
    html += '<p class="notice">' + (lien ? 'Le lien <b>/' + esc(cle) + '</b> n\'est pas encore configuré.'
      : 'Le lien <b>/' + esc(cle) + '</b> n\'existe pas. Vérifie l\'adresse ou choisis un outil ci-dessous.') + '</p>';
  }
  html += '<div class="connexion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>' +
    '<div><b>Connecte-toi aux outils avec ton adresse <span class="dom">@or-edhec.com</span></b>' +
    '<span>Un code de connexion te sera envoyé par mail.</span></div></div>';
  var icoPartage = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>';
  html += cles.length ? '<ul>' + cles.map(function (k) {
    var e = L[k];
    return '<li class="lien"><h2>' + esc(e.titre || k) + '</h2>' +
      (e.description ? '<p class="desc">' + esc(e.description) + '</p>' : '') +
      '<div class="actions"><a class="btn primary" href="' + esc('https://' + court(k)) + '" target="_blank" rel="noopener">Ouvrir l\'outil</a>' +
      '<button type="button" class="btn discret" data-partage="' + esc('https://' + court(k)) + '" aria-label="Partager le lien de ' + esc(e.titre || k) + '">' + icoPartage + 'Partager</button></div></li>';
  }).join('') + '</ul>' : '<ul><li class="vide">Aucun outil pour le moment : ajoute un lien dans liens.js.</li></ul>';
  html += '<div class="toast" role="status" aria-live="polite"></div>';
  app.innerHTML = html;

  var toast = app.querySelector('.toast'), minuteur;
  var annonce = function (txt) {
    toast.textContent = txt; toast.classList.add('on');
    clearTimeout(minuteur); minuteur = setTimeout(function () { toast.classList.remove('on'); }, 2500);
  };
  // Copie de secours (ancien navigateur, page sans HTTPS…)
  var copieSecours = function (txt) {
    var t = document.createElement('textarea');
    t.value = txt; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(t);
    return ok;
  };

  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-partage]');
    if (!b) return;
    var txt = b.getAttribute('data-partage');
    var ok = function () { annonce('Le lien a bien été copié'); };
    var ko = function () { if (copieSecours(txt)) ok(); else prompt('Copie ce lien :', txt); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok, ko);
    else ko();
  });
})();
</script>
</body>
</html>
